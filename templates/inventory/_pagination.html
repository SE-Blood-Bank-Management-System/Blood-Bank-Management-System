{% if page_obj.has_other_pages %}
<nav aria-label="Result pages" class="d-flex justify-content-between align-items-center p-3">
  <span class="text-muted small">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  <div>
    {% if page_obj.has_previous %}<a class="btn btn-outline-secondary btn-sm" href="?page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-outline-secondary btn-sm" href="?page={{ page_obj.next_page_number }}">Next</a>{% endif %}
  </div>
</nav>
{% endif %}
