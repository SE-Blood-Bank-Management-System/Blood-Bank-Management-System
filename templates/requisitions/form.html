{% extends 'base.html' %}
{% block title %}New blood requisition · BBMS{% endblock %}
{% block content %}
<div class="container" style="max-width: 720px;">
  <a href="{% url 'requisitions:list' %}" class="btn btn-link ps-0">Back to my requisitions</a>
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3">Request blood</h1>
    <p class="text-muted">Submit your hospital's requirements for blood-bank staff to review.</p>
    <form method="post">
      {% csrf_token %}
      {% include 'requisitions/fields.html' %}
      <button class="btn btn-danger" type="submit">Submit requisition</button>
    </form>
  </div></div>
</div>
{% endblock %}
