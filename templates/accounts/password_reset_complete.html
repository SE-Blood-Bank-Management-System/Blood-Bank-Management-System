{% extends 'base.html' %}

{% block title %}Password Reset Complete - BBMS{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 mt-3">
        <div class="card-body p-4 p-md-5 text-center">
          <div class="text-success fs-1 mb-3">
            <i class="bi bi-check-circle-fill"></i>
          </div>
          <h3 class="fw-bold mb-2">Password Reset Successful</h3>
          <p class="text-muted">
            Your password has been reset securely. You can now use your new password to sign in.
          </p>
          <a href="{% url 'accounts:login' %}" class="btn btn-danger w-100 py-2 mt-3 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>Sign In Now
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
