{% extends 'base.html' %}

{% block title %}Sign In - BBMS{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 mt-3">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <span class="drop-icon text-danger fs-1"><i class="bi bi-droplet-fill"></i></span>
            <h3 class="fw-bold mt-2">Sign In to BBMS</h3>
            <p class="text-muted small">Enter your credentials to access your role dashboard</p>
          </div>

          <form method="post" action="{% url 'accounts:login' %}" novalidate>
            {% csrf_token %}
            {% if request.GET.next %}
              <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}

            <div class="mb-3">
              <label for="id_username" class="form-label fw-semibold">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" id="id_username" placeholder="Username" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <label for="id_password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" id="id_password" placeholder="Password" required>
              </div>
            </div>

            <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </button>
          </form>

          <hr class="my-4">

          <div class="text-center">
            <p class="text-muted small mb-2">Don't have an account?</p>
            <div class="d-flex justify-content-center gap-3">
              <a href="{% url 'accounts:register_donor' %}" class="small text-danger fw-semibold text-decoration-none">
                <i class="bi bi-heart me-1"></i>Register as Donor
              </a>
              <span class="text-muted small">&bull;</span>
              <a href="{% url 'accounts:register_hospital' %}" class="small text-primary fw-semibold text-decoration-none">
                <i class="bi bi-hospital me-1"></i>Register Hospital
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
