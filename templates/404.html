{% extends 'base.html' %}

{% block title %}404 Page Not Found - BBMS{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6 text-center">
      <div class="card shadow-sm border-0 p-4">
        <div class="card-body">
          <div class="mb-3 text-danger fs-1">
            <i class="bi bi-compass"></i>
          </div>
          <h2 class="fw-bold mb-2">404 - Page Not Found</h2>
          <p class="text-muted">
            The resource you requested could not be found or may have moved.
          </p>
          <div class="alert alert-light border small text-start mb-4">
            <i class="bi bi-info-circle text-primary me-1"></i>
            Please check the URL in your browser's address bar or return to the main portal.
          </div>
          <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'core:home' %}" class="btn btn-outline-secondary">
              <i class="bi bi-house me-1"></i>Return Home
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
